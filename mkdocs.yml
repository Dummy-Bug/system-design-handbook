site_name: System Design
site_url: https://dummy-bug.github.io/system-design-handbook/
site_description: System Design Interview notes — every concept explained with reasoning, scale math, and real-world examples.

theme:
  name: material
  palette:
    scheme: default
    primary: white
    accent: indigo
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - callouts
  - exclude:
      glob:
        - "11-Case-Studies/*"
        - "00-Syllabus/*"

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

docs_dir: "System Design/SDE2"

